name = "pdpm-ltc-tracker"
main = "worker/index.ts"
compatibility_date = "2026-06-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "pdpm_ltc_tracker"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[observability]
enabled = true
